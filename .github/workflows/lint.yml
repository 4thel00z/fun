name: Lint

on:
  pull_request:
  workflow_dispatch:

env:
  FUN_VERSION: "1.2.10"

jobs:
  lint-js:
    name: "Lint JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Fun
        uses: ./.github/actions/setup-fun
        with:
          fun-version: ${{ env.FUN_VERSION }}
      - name: Lint
        run: fun lint
