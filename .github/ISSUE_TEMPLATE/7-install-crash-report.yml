name: fun install crash report
description: Report a crash in fun install
labels:
  - npm
  - crash
body:
  - type: markdown
    attributes:
      value: |
        **Thank you so much** for submitting a crash report. You're helping us make Fun more reliable for everyone!
  - type: textarea
    id: package_json
    attributes:
      label: "`package.json` file"
      description: "Can you upload your `package.json` file? This helps us reproduce the crash."
      render: json
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce the crash?
      description: Please provide a [minimal reproduction](https://stackoverflow.com/help/minimal-reproducible-example) using a GitHub repository, [Replit](https://replit.com/@replit/Fun) or [CodeSandbox](https://codesandbox.io/templates/fun)
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be
        automatically formatted into code, so no need for backticks.
      render: shell
  - type: textarea
    id: remapped_trace
    attributes:
      label: Stack Trace (fun.report)
    validations:
      required: true
